<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Animation: after you leave, ctx-handoff refreshes the conversation cache at 55, 110 and 165 minutes so it never expires; after that it saves a handoff summary, and when you return you choose to resume or continue">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .t { fill: #c9d1d9; font-size: 15px; } .m { fill: #8b949e; font-size: 13px; }
      /* 9 秒一輪：時間點從離開走到回來 */
      .dot { animation: dot 9s linear infinite; }
      @keyframes dot { 0% { transform: translateX(0); } 88%, 100% { transform: translateX(760px); } }
      .ttl { animation: ttl 9s linear infinite; transform-box: fill-box; transform-origin: left center; }
      @keyframes ttl {
        0% { transform: scaleX(1); } 18% { transform: scaleX(0.12); } 18.5% { transform: scaleX(1); }
        37% { transform: scaleX(0.12); } 37.5% { transform: scaleX(1); }
        56% { transform: scaleX(0.12); } 56.5% { transform: scaleX(1); }
        75%, 100% { transform: scaleX(0.12); }
      }
      .p1 { animation: p1 9s linear infinite; } @keyframes p1 { 0%, 17% { opacity: 0.25; } 19%, 100% { opacity: 1; } }
      .p2 { animation: p2 9s linear infinite; } @keyframes p2 { 0%, 36% { opacity: 0.25; } 38%, 100% { opacity: 1; } }
      .p3 { animation: p3 9s linear infinite; } @keyframes p3 { 0%, 55% { opacity: 0.25; } 57%, 100% { opacity: 1; } }
      .p4 { animation: p4 9s linear infinite; } @keyframes p4 { 0%, 74% { opacity: 0.25; } 76%, 100% { opacity: 1; } }
      .back { animation: back 9s linear infinite; } @keyframes back { 0%, 86% { opacity: 0; } 89%, 100% { opacity: 1; } }
    </style>
  </defs>
  <rect width="960" height="300" rx="18" fill="#0d1117"/>
  <text x="40" y="48" class="sans" font-size="17" font-weight="600" fill="#e6edf3">You step away. The cache doesn't expire.</text>
  <text x="40" y="72" class="sans m">The conversation cache lasts 60 minutes; a tiny refresh every 55 keeps it, at about a tenth of the input price.</text>

  <!-- 時間軸 -->
  <line x1="80" y1="150" x2="840" y2="150" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
  <g class="sans m" text-anchor="middle">
    <text x="80" y="128">you leave</text>
    <text x="80" y="182" class="mono">0m</text>
    <g class="p1"><circle cx="232" cy="150" r="9" fill="#4ade80"/><text x="232" y="128" fill="#4ade80">refresh</text><text x="232" y="182" class="mono">55m</text></g>
    <g class="p2"><circle cx="384" cy="150" r="9" fill="#4ade80"/><text x="384" y="128" fill="#4ade80">refresh</text><text x="384" y="182" class="mono">110m</text></g>
    <g class="p3"><circle cx="536" cy="150" r="9" fill="#4ade80"/><text x="536" y="128" fill="#4ade80">refresh</text><text x="536" y="182" class="mono">165m</text></g>
    <g class="p4"><circle cx="688" cy="150" r="9" fill="#fbbf24"/><text x="688" y="128" fill="#fbbf24">summary saved</text><text x="688" y="182" class="mono">~4h</text></g>
  </g>
  <g class="dot"><circle cx="80" cy="150" r="7" fill="#7dd3fc"/><circle cx="80" cy="150" r="14" fill="none" stroke="#7dd3fc" opacity="0.4"/></g>

  <!-- 快取剩餘時間 -->
  <text x="40" y="232" class="sans m">cache</text>
  <rect x="96" y="221" width="300" height="14" rx="7" fill="#21262d"/>
  <rect class="ttl" x="96" y="221" width="300" height="14" rx="7" fill="#4ade80"/>
  <text x="408" y="232" class="mono m">60 min, renewed each refresh</text>

  <g class="back">
    <rect x="590" y="206" width="330" height="62" rx="10" fill="#161b22" stroke="#7dd3fc"/>
    <text x="608" y="232" class="sans t">You're back. Pick one:</text>
    <text x="608" y="256" class="mono m"><tspan fill="#7dd3fc">/handoff resume</tspan>  or  <tspan fill="#7dd3fc">continue</tspan></text>
  </g>
</svg>
